$mainMod = SUPER

bind = $mainMod, Return,     exec, ghostty
bind = $mainMod, E,          exec, thunar
bind = $mainMod, B,          exec, firefox
bind = $mainMod, N,          exec, ghostty -e nvim
bind = $mainMod, D,          exec, rofi -show drun -show-icons
bind = $mainMod, V,          exec, rofi -modi "Portapapeles:greenclip print" -show Portapapeles -run-command '{cmd}'
bind = ,        Print,       exec, flameshot gui
bind = $mainMod, X,          exec, hyprlock
bind = CTRL,    Tab,         exec, rofi -show window -show-icons

bind = $mainMod, W,          killactive
bind = $mainMod SHIFT, W,    closewindow
bind = $mainMod, F,          fullscreen
bind = $mainMod SHIFT, T,    togglefloating
bind = $mainMod, M,          layoutmsg, togglesplit
bind = $mainMod, P,          pseudo

bind = $mainMod, H,          movefocus, l
bind = $mainMod, J,          movefocus, d
bind = $mainMod, K,          movefocus, u
bind = $mainMod, L,          movefocus, r

bind = $mainMod SHIFT, H,    movewindow, l
bind = $mainMod SHIFT, J,    movewindow, d
bind = $mainMod SHIFT, K,    movewindow, u
bind = $mainMod SHIFT, L,    movewindow, r

bind = $mainMod ALT, H,      resizeactive, -40 0
bind = $mainMod ALT, J,      resizeactive, 0 40
bind = $mainMod ALT, K,      resizeactive, 0 -40
bind = $mainMod ALT, L,      resizeactive, 40 0

bind = $mainMod, Left,       moveactive, -20 0
bind = $mainMod, Down,       moveactive, 0 20
bind = $mainMod, Up,         moveactive, 0 -20
bind = $mainMod, Right,      moveactive, 20 0

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, grave,         workspace, previous
bind = $mainMod, Tab,           workspace, previous
bind = $mainMod, bracketleft,   workspace, e+1
bind = $mainMod, bracketright,  workspace, e-1

bind = $mainMod, Semicolon,            togglespecialworkspace
bind = $mainMod SHIFT, Semicolon,      movetoworkspace, special

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

bindel = , XF86AudioMute,           exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume,    exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume,    exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioMicMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessDown,   exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp,     exec, brightnessctl set +5%
bind = ,    XF86Display,            exec, wlr-randr
bind = ,    XF86ScreenSaver,        exec, hyprlock
bind = ,    XF86Calculator,         exec, ghostty -e bc

bind = $mainMod ALT, Q,   exec, hyprctl dispatch exit
bind = $mainMod ALT, R,   exec, hyprctl reload
bind = $mainMod, Escape,  exec, hyprctl reload
